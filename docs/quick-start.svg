<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="The OnePromptMan kit in three steps: download, upload both plugin files, set up and run">
<title>The OnePromptMan kit in three steps</title>
<rect width="960" height="330" rx="14" fill="#ffffff" stroke="#d1d9e0"/>
<g font-family="Segoe UI,Helvetica,Arial,sans-serif">
<text x="30" y="44" font-size="20" fill="#1f2328" font-weight="700">The kit in three steps</text>

<rect x="30" y="66" width="290" height="236" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
<circle cx="60" cy="100" r="16" fill="#104e9e"/>
<text x="60" y="106" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="86" y="106" font-size="17" fill="#1f2328" font-weight="700">Download</text>
<rect x="46" y="128" width="258" height="82" rx="8" fill="#ffffff" stroke="#d1d9e0"/>
<g font-family="ui-monospace,Consolas,Menlo,monospace" font-size="13" fill="#1f2328">
<text x="58" y="150">OnePromptMan-kit.zip</text>
<text x="58" y="170">Unzip it</text>
<text x="58" y="190">Open Start here.html</text>
</g>
<text x="48" y="242" font-size="14" fill="#59636e">One download: both helpers and a</text>
<text x="48" y="262" font-size="14" fill="#59636e">step-by-step guide.</text>
<path d="M322 184 h9 m-5 -5 l5 5 l-5 5" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"/>

<rect x="335" y="66" width="290" height="236" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
<circle cx="365" cy="100" r="16" fill="#104e9e"/>
<text x="365" y="106" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="391" y="106" font-size="17" fill="#1f2328" font-weight="700">Upload</text>
<rect x="351" y="128" width="258" height="102" rx="8" fill="#ffffff" stroke="#d1d9e0"/>
<g font-family="ui-monospace,Consolas,Menlo,monospace" font-size="13" fill="#1f2328">
<text x="363" y="150">Customize &gt; Plugins</text>
<text x="363" y="170">Add &gt; Upload plugin</text>
<text x="363" y="190">build-radar.zip</text>
<text x="363" y="210">talent-alpha.zip</text>
</g>
<text x="353" y="262" font-size="14" fill="#59636e">Upload both files as they are.</text>
<text x="353" y="282" font-size="14" fill="#59636e">Do not unzip them.</text>
<path d="M627 184 h9 m-5 -5 l5 5 l-5 5" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"/>

<rect x="640" y="66" width="290" height="236" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
<circle cx="670" cy="100" r="16" fill="#104e9e"/>
<text x="670" y="106" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="696" y="106" font-size="17" fill="#1f2328" font-weight="700">Set up and run</text>
<rect x="656" y="128" width="258" height="82" rx="8" fill="#ffffff" stroke="#d1d9e0"/>
<g font-family="ui-monospace,Consolas,Menlo,monospace" font-size="13" fill="#1f2328">
<text x="668" y="150">set up talent alpha</text>
<text x="668" y="170">run talent alpha</text>
<text x="668" y="190">(or build radar)</text>
</g>
<text x="658" y="242" font-size="14" fill="#59636e">In a new Cowork task with an</text>
<text x="658" y="262" font-size="14" fill="#59636e">empty folder. A few questions,</text>
<text x="658" y="282" font-size="14" fill="#59636e">then your card is saved there.</text>
</g>
</svg>
