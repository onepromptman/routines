<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" role="img" aria-label="What setup asks, one question at a time"><rect width="960" height="510" rx="14" fill="#ffffff" stroke="#d1d9e0"/><text x="30" y="44" font-size="20" fill="#1f2328" font-weight="700" font-family="Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">What setup asks, one question at a time</text><rect x="753.2" y="70" width="176.79999999999998" height="38" rx="12" fill="#1f6feb"/><text x="771.2" y="94" font-size="14" fill="#ffffff" font-weight="400" font-family="Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">set up build radar</text><rect x="30" y="120" width="389.59999999999997" height="38" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><text x="48" y="144" font-size="14" fill="#1f2328" font-weight="400" font-family="Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">Who is this radar for, and what do they build?</text><rect x="494.8" y="170" width="435.2" height="38" rx="12" fill="#1f6feb"/><text x="512.8" y="194" font-size="14" fill="#ffffff" font-weight="400" font-family="Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">Me. I build internal AI tools for a recruiting team.</text><rect x="30" y="220" width="541.5999999999999" height="38" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><text x="48" y="244" font-size="14" fill="#1f2328" font-weight="400" font-family="Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">Which sources should it watch? Pick from the list or add your own.</text><rect x="555.6" y="270" width="374.4" height="38" rx="12" fill="#1f6feb"/><text x="573.6" y="294" font-size="14" fill="#ffffff" font-weight="400" font-family="Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">The defaults, plus two newsletters I follow.</text><rect x="30" y="320" width="488.4" height="38" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><text x="48" y="344" font-size="14" fill="#1f2328" font-weight="400" font-family="Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">Anything to always leave out? When should it run?</text><rect x="517.6" y="370" width="412.4" height="38" rx="12" fill="#1f6feb"/><text x="535.6" y="394" font-size="14" fill="#ffffff" font-weight="400" font-family="Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">Skip crypto. Whenever I ask is fine.</text><rect x="30" y="420" width="556.8" height="38" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><text x="48" y="444" font-size="14" fill="#1f2328" font-weight="400" font-family="Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">Saved. Say &quot;run build radar&quot; whenever you want this week&#x27;s briefing.</text><text x="30" y="492" font-size="13" fill="#59636e" font-weight="400" font-family="Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">An illustration of the conversation, not a screenshot. Your answers will differ.</text></svg>
